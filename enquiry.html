
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Enquiry | DISD1 RAMS PLUMBING</title>

    <meta name="description"
          content="Send a plumbing enquiry to DISD1 RAMS PLUMBING and request a quotation for plumbing services.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DISD1 RAMS PLUMBING</h1>

        <nav>
             <img src="images/logo.jpg" style="width:75px; height:85px">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Customer Enquiry Form</h2>

            <p>
                Tell us about your plumbing needs.
                We will use your information to respond
                to your enquiry.
            </p>
        </section>

        <section class="enquiry-section">

            <h2>Request a Plumbing Service</h2>

            <form id="enquiryForm">

                <label for="name">Full Name:</label>

                <input type="text"
                       id="name"
                       name="name"
                       required>

                <label for="email">Email Address:</label>

                <input type="email"
                       id="email"
                       name="email"
                       required>

                <label for="phone">Phone Number:</label>

                <input type="tel"
                       id="phone"
                       name="phone"
                       required>

                <label for="service">Select a Service:</label>

                <select id="service"
                        name="service"
                        required>

                    <option value="">Choose a service</option>
                    <option value="Plumbing Repairs">Plumbing Repairs</option>
                    <option value="Leak Repairs">Leak Repairs</option>
                    <option value="Blocked Drains">Blocked Drains</option>
                    <option value="Emergency Plumbing">Emergency Plumbing</option>
                    <option value="Bathroom Plumbing">Bathroom Plumbing</option>
                    <option value="Pipe Repairs">Pipe Repairs</option>

                </select>

                <label for="message">Describe Your Enquiry:</label>

                <textarea id="message"
                          name="message"
                          rows="5"
                          required></textarea>

                <button type="submit" class="button">
                    Submit Enquiry
                </button>

                <p id="formMessage" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 DISD1 RAMS PLUMBING. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
